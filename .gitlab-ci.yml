variables:   
    COVERLET_PATH: '/home/larry/.dotnet/tools/coverlet'   

stages:
    - build
    - test
    - deploy

Build:
    stage: build
    script:       
        - dotnet clean
        - dotnet build

UnitTest:
    stage: test    
    script:
        - '& "$COVERLET_PATH" "$CI_PROJECT_DIR/tests/unit/AspNetCoreSample.Tests/bin/Debug/netcoreapp2.1/AspNetCoreSample.Tests.dll" --target dotnet --targetargs "test ""$CI_PROJECT_DIR/tests/unit/AspNetCoreSample.Tests/AspNetCoreSample.Tests.csproj"" --no-build --logger ""trx;LogFileName=$CI_PROJECT_DIR/AspNetCoreSample.Tests-UnitTest.trx""" --format opencover --output "$CI_PROJECT_DIR/AspNetCoreSample.Tests-Coverage.xml" --exclude=[xunit.*]*'
    dependencies:
        - Build