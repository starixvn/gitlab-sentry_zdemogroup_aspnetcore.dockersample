variables:   
    TEST_FOLDER: 'Tests\bin\Release'
    DEPLOY_FOLDER: 'P:\Projects\YourApp\Builds'    
    NUNIT_PATH: 'C:\Program Files (x86)\NUnit.org\nunit-console\nunit3-console.exe'

stages:
    - build
    - test
    - deploy

Build:
    stage: build
    script:       
        - dotnet clean
        - dotnet build

UnitTest:
    stage: test    
    script:
        - '& coverlet "" --target dotnet --targetargs "test """"$CI_PROJECT_DIR/tests/unit/AspNetCoreSample.Tests/AspNetCoreSample.Tests.csproj"""" --logger """"trx;LogFileName=$CI_PROJECT_DIR/AspNetCoreSample.Tests-UnitTest.trx""""" --format opencover --output "$CI_PROJECT_DIR/AspNetCoreSample.Tests-Coverage.xml" --exclude=[xunit.*]*'
    dependencies:
        - Build