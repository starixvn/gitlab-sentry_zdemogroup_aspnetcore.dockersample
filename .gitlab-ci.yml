variables:   
    TEST_FOLDER: 'Tests\bin\Release'
    DEPLOY_FOLDER: 'P:\Projects\YourApp\Builds'    
    NUNIT_PATH: 'C:\Program Files (x86)\NUnit.org\nunit-console\nunit3-console.exe'

stages:
    - build
    - test
    - deploy

Build:
    stage: build
    script:
        - echo '$env:CI_PROJECT_DIR'
        - dotnet clean
        - dotnet build

UnitTest:
    stage: test    
    script:
        - dotnet test   
    dependencies:
        - Build