variables:
    ROCKETOR_PUBLISH: "/home/gitlab-runner/Fanex.Rocketor.PublishAgent/Fanex.Rocketor.PublishAgent"

stages:
    - build
    - test
    - deploy

build:
    stage: build
    before_script:      
        - dotnet clean
    script:       
        - dotnet build

unit_test:
    stage: test   
    script:
        - dotnet sonarscanner begin /k:"AspNetCoreSample" /n:"AspNet Core Sample" /v:"${CI_COMMIT_REF_NAME}-[${CI_JOB_ID}]" /d:sonar.cs.opencover.reportsPaths="${CI_PROJECT_DIR}/Reports/*.xml" /d:sonar.cs.vstest.reportsPaths="${CI_PROJECT_DIR}/Reports/*.trx"
        - cd 'tests/unit/AspNetCoreSample.Tests'
        - dotnet add package coverlet.msbuild
        - cd "${CI_PROJECT_DIR}"
        - dotnet test /p:CollectCoverage=true /p:CoverletOutputFormat=opencover /p:CoverletOutput="${CI_PROJECT_DIR}/Reports/" /p:Exclude=[xunit.*]* --logger "trx;LogFileName=${CI_PROJECT_DIR}/Reports/UnitTest.trx"       
        - dotnet sonarscanner end        
    artifacts:
        when: always
        paths:
          - Reports/
        expire_in: 1 week
    
deploy_local:
    stage: deploy
    script:
        - $ROCKETOR_PUBLISH --locationids=11202 --branchname="${CI_COMMIT_REF_NAME}" --commithash="${CI_COMMIT_SHA}" --workspace="${CI_PROJECT_DIR}"
    environment:
        name: local
        url: https://local.example.com
    dependencies: []

automation_test:
    stage: test   
    script:
        - echo "Automation test"
        
deploy_uat:
    stage: deploy
    script:
        - echo "Deploy to UAT"
    environment:
        name: UAT
        url: https://uat.example.com
    dependencies: []