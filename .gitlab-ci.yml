variables:

stages:
    - build
    - test
    - deploy

build:
    stage: build
    before_script:
        - dotnet clean
    script:       
        - dotnet build

unitTest:
    stage: test   
    script:
        - dotnet sonarscanner begin /k:"AspNetCoreSample" /n:"AspNet Core Sample" /v:"${CI_JOB_ID}" /d:sonar.cs.opencover.reportsPaths="${CI_PROJECT_DIR}/results/*.xml" /d:sonar.cs.vstest.reportsPaths="${CI_PROJECT_DIR}/results/*.trx"
        - cd 'tests/unit/AspNetCoreSample.Tests'
        - dotnet add package coverlet.msbuild
        - cd "${CI_PROJECT_DIR}"
        - dotnet test /p:CollectCoverage=true /p:CoverletOutputFormat=opencover /p:CoverletOutput="${CI_PROJECT_DIR}/results/" /p:Exclude=[xunit.*]* --logger "trx;LogFileName=${CI_PROJECT_DIR}/results/UnitTest.trx"
        - dotnet sonarscanner end    
    artifacts:
        name: 'CoverageResult'
        paths: 
            - results/
    dependencies:
        - build